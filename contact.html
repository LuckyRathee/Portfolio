<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Lucky Rathee</title>
  <meta name="description" content="Get in touch with Lucky Rathee, AI Engineer." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg stroke='%23e5323b' stroke-width='15'%3E%3Cline x1='50' y1='4' x2='50' y2='96'/%3E%3Cline x1='10.2' y1='27' x2='89.8' y2='73'/%3E%3Cline x1='10.2' y1='73' x2='89.8' y2='27'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="contact">
  <header id="site-header"></header>

  <main>
    <section class="page-head center">
      <div class="container">
        <h1 class="reveal">Get in touch</h1>
        <p class="reveal d1">Open to full-time AI engineering roles and freelance projects. Pick a topic, send a message, and I’ll get back to you.</p>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="topics reveal d2" role="group" aria-label="What is this about?">
          <span>I’m reaching out about</span>
          <button type="button" data-topic="Full-time AI role">A full-time role</button>
          <button type="button" data-topic="Freelance project">A freelance project</button>
          <button type="button" data-topic="Research collaboration">Research</button>
          <button type="button" data-topic="Hello">Just saying hi</button>
        </div>
        <form class="contact-form reveal d2" id="contact-form">
          <input name="name" type="text" placeholder="Full name" required autocomplete="name" />
          <input name="email" type="email" placeholder="Email address" required autocomplete="email" />
          <input name="phone" type="tel" placeholder="Phone Number" autocomplete="tel" />
          <input name="subject" type="text" placeholder="Subject" />
          <textarea class="full" name="message" placeholder="Write your message here" required></textarea>
          <button class="btn" type="submit">Send message</button>
          <p class="form-note" id="form-note">Opens your email app with the message ready to send.</p>
        </form>
      </div>
    </section>

    <section class="section" style="padding-top:60px">
      <div class="container">
        <div class="contact-cards" id="cards"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/motion.js"></script>
  <script>
    document.getElementById("cards").innerHTML = `
      <div class="contact-card reveal"><span>Email</span><a href="mailto:${SITE.email}">${SITE.email}</a></div>
      <div class="contact-card reveal d1"><span>Phone</span><a href="tel:${SITE.phone.replace(/\s/g, "")}">${SITE.phone}</a></div>
      <div class="contact-card reveal d2"><span>Based in</span><p>${SITE.location}</p></div>`;

    const subjectInput = document.querySelector('[name="subject"]');
    document.querySelectorAll(".topics button").forEach((b) =>
      b.addEventListener("click", () => {
        document.querySelectorAll(".topics button").forEach((x) => x.classList.toggle("on", x === b));
        subjectInput.value = b.dataset.topic;
      })
    );

    document.getElementById("contact-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const subject = f.get("subject") || `Hello from ${f.get("name")}`;
      const body = `${f.get("message")}\n\n— ${f.get("name")}\n${f.get("email")}${f.get("phone") ? "\n" + f.get("phone") : ""}`;
      location.href = `mailto:${SITE.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      document.getElementById("form-note").textContent = "Thanks! Your email app should open now.";
    });
  </script>
  <script src="js/chat.js"></script>
</body>
</html>
