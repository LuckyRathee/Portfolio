<body data-page="research">
  <header id="site-header"></header>

  <main>
    <section class="page-head split">
      <div class="container">
        <h1 class="reveal">Research</h1>
        <p class="lead reveal d1">Where networks meet medicine — my research on ultra-low-latency communication.</p>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container">
        <div id="featured"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/motion.js"></script>
  <script>
    const feat = RESEARCH[0];
    const meta = (r) => `<div class="post-meta"><span>${r.venue}</span><span class="sep"></span><span>${r.status} · ${r.date}</span></div>`;

    document.getElementById("featured").innerHTML = `
      <article class="feature">
        <a class="work-visual reveal" href="paper.html?id=${feat.id}">${researchArt(feat)}</a>
        <div>
          <div class="reveal">${meta(feat)}</div>
          <h2 class="reveal d1">${feat.title}</h2>
          <p class="reveal d2">${feat.summary}</p>
          <a class="link-arrow reveal d3" href="paper.html?id=${feat.id}">Read more ${ICONS.arrow}</a>
        </div>
      </article>`;

  </script>
  <script src="js/chat.js"></script>
